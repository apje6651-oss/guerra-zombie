<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Guerra Zombie</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #111;
}

canvas {
    display: block;
}

#mensaje {
    position: fixed;
    top: 20px;
    left: 20px;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 20px;
    z-index: 10;
    text-shadow: 2px 2px 4px black;
}

#vida {
    position: fixed;
    top: 20px;
    right: 20px;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 20px;
    z-index: 10;
    text-shadow: 2px 2px 4px black;
}

#instrucciones {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-family: Arial, sans-serif;
    font-size: 16px;
    z-index: 10;
    text-align: center;
    text-shadow: 2px 2px 4px black;
}

#puntoMira {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 8px;
    height: 8px;
    margin-left: -4px;
    margin-top: -4px;
    border: 2px solid white;
    border-radius: 50%;
    z-index: 20;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="mensaje">
    🧟 GUERRA ZOMBIE<br>
    <span style="font-size:14px;">
        Sobrevive a los zombies
    </span>
</div>

<div id="vida">
    ❤️ Vida: <span id="numeroVida">100</span>
</div>

<div id="instrucciones">
    CLIC = jugar | WASD = moverse | MOUSE = mirar
</div>

<div id="puntoMira"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

// ========================================
// ESCENA
// ========================================

const escena = new THREE.Scene();

escena.background = new THREE.Color(0x87CEEB);


// ========================================
// LUZ
// ========================================

const luz = new THREE.HemisphereLight(
    0xffffff,
    0x444444,
    2
);

escena.add(luz);


// ========================================
// JUGADOR
// ========================================

const jugador = new THREE.Object3D();

jugador.position.set(
    0,
    0,
    5
);

escena.add(jugador);


// ========================================
// CÁMARA
// ========================================

const camara = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camara.position.set(
    0,
    1.7,
    0
);

jugador.add(camara);


// ========================================
// RENDERIZADOR
// ========================================

const renderizador = new THREE.WebGLRenderer({
    antialias: true
});

renderizador.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(
    renderizador.domElement
);


// ========================================
// SUELO
// ========================================

const TAMANO_MAPA = 200;

const sueloGeometria = new THREE.PlaneGeometry(
    TAMANO_MAPA,
    TAMANO_MAPA
);

const sueloMaterial = new THREE.MeshStandardMaterial({
    color: 0x3b7d3b
});

const suelo = new THREE.Mesh(
    sueloGeometria,
    sueloMaterial
);

suelo.rotation.x = -Math.PI / 2;

escena.add(suelo);


// ========================================
// CUADRÍCULA
// ========================================

const cuadricula = new THREE.GridHelper(
    TAMANO_MAPA,
    100,
    0x222222,
    0x555555
);

cuadricula.position.y = 0.01;

escena.add(cuadricula);


// ========================================
// PAREDES INVISIBLES
// ========================================

const BORDE = 99;

const materialInvisible = new THREE.MeshBasicMaterial({
    transparent: true,
    opacity: 0
});

const ALTURA_PARED = 10;
const GROSOR_PARED = 2;


// Norte

const paredNorte = new THREE.Mesh(
    new THREE.BoxGeometry(
        TAMANO_MAPA,
        ALTURA_PARED,
        GROSOR_PARED
    ),
    materialInvisible
);

paredNorte.position.set(
    0,
    ALTURA_PARED / 2,
    -BORDE
);

escena.add(paredNorte);


// Sur

const paredSur = new THREE.Mesh(
    new THREE.BoxGeometry(
        TAMANO_MAPA,
        ALTURA_PARED,
        GROSOR_PARED
    ),
    materialInvisible
);

paredSur.position.set(
    0,
    ALTURA_PARED / 2,
    BORDE
);

escena.add(paredSur);


// Oeste

const paredOeste = new THREE.Mesh(
    new THREE.BoxGeometry(
        GROSOR_PARED,
        ALTURA_PARED,
        TAMANO_MAPA
    ),
    materialInvisible
);

paredOeste.position.set(
    -BORDE,
    ALTURA_PARED / 2,
    0
);

escena.add(paredOeste);


// Este

const paredEste = new THREE.Mesh(
    new THREE.BoxGeometry(
        GROSOR_PARED,
        ALTURA_PARED,
        TAMANO_MAPA
    ),
    materialInvisible
);

paredEste.position.set(
    BORDE,
    ALTURA_PARED / 2,
    0
);

escena.add(paredEste);


// ========================================
// TECLADO
// ========================================

const teclas = {};

document.addEventListener(
    "keydown",
    (evento) => {
        teclas[evento.key.toLowerCase()] = true;
    }
);

document.addEventListener(
    "keyup",
    (evento) => {
        teclas[evento.key.toLowerCase()] = false;
    }
);


// ========================================
// MOUSE
// ========================================

let yaw = 0;
let pitch = 0;

document.addEventListener(
    "click",
    () => {
        document.body.requestPointerLock();
    }
);

document.addEventListener(
    "mousemove",
    (evento) => {

        if (
            document.pointerLockElement !==
            document.body
        ) {
            return;
        }

        const sensibilidad = 0.002;

        yaw -= evento.movementX * sensibilidad;

        pitch -= evento.movementY * sensibilidad;

        const limiteVertical =
            Math.PI / 2 - 0.05;

        pitch = Math.max(
            -limiteVertical,
            Math.min(
                limiteVertical,
                pitch
            )
        );

        jugador.rotation.y = yaw;

        camara.rotation.x = pitch;
    }
);


// ========================================
// MOVIMIENTO
// ========================================

const velocidad = 0.12;

function actualizarJugador() {

    let adelante = 0;
    let derecha = 0;

    if (teclas["w"]) {
        adelante += 1;
    }

    if (teclas["s"]) {
        adelante -= 1;
    }

    if (teclas["d"]) {
        derecha += 1;
    }

    if (teclas["a"]) {
        derecha -= 1;
    }

    const longitud = Math.sqrt(
        adelante * adelante +
        derecha * derecha
    );

    if (longitud > 0) {

        adelante /= longitud;
        derecha /= longitud;

        jugador.translateZ(
            -adelante * velocidad
        );

        jugador.translateX(
            derecha * velocidad
        );
    }

    const radioJugador = 1;

    const limiteMovimiento =
        BORDE -
        GROSOR_PARED / 2 -
        radioJugador;

    if (jugador.position.x < -limiteMovimiento) {
        jugador.position.x = -limiteMovimiento;
    }

    if (jugador.position.x > limiteMovimiento) {
        jugador.position.x = limiteMovimiento;
    }

    if (jugador.position.z < -limiteMovimiento) {
        jugador.position.z = -limiteMovimiento;
    }

    if (jugador.position.z > limiteMovimiento) {
        jugador.position.z = limiteMovimiento;
    }

    jugador.position.y = 0;
}


// ========================================
// ZOMBIE
// ========================================

const zombies = [];

function crearZombie(x, z) {

    const zombie = new THREE.Group();

    // Cuerpo

    const cuerpo = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1.5, 0.7),
        new THREE.MeshStandardMaterial({
            color: 0x315c31
        })
    );

    cuerpo.position.y = 0.75;

    zombie.add(cuerpo);


    // Cabeza

    const cabeza = new THREE.Mesh(
        new THREE.BoxGeometry(0.8, 0.8, 0.8),
        new THREE.MeshStandardMaterial({
            color: 0x4f8f4f
        })
    );

    cabeza.position.y = 1.9;

    zombie.add(cabeza);


    // Ojos

    const ojoMaterial =
        new THREE.MeshBasicMaterial({
            color: 0xff0000
        });

    const ojoIzquierdo = new THREE.Mesh(
        new THREE.SphereGeometry(0.08, 8, 8),
        ojoMaterial
    );

    ojoIzquierdo.position.set(
        -0.18,
        2,
        -0.4
    );

    zombie.add(ojoIzquierdo);


    const ojoDerecho = new THREE.Mesh(
        new THREE.SphereGeometry(0.08, 8, 8),
        ojoMaterial
    );

    ojoDerecho.position.set(
        0.18,
        2,
        -0.4
    );

    zombie.add(ojoDerecho);


    zombie.position.set(
        x,
        0,
        z
    );

    escena.add(zombie);

    zombies.push({
        objeto: zombie,
        velocidad: 0.025,
        ultimoAtaque: 0
    });
}


// ========================================
// CREAR PRIMER ZOMBIE
// ========================================

crearZombie(0, -15);


// ========================================
// VIDA
// ========================================

let vida = 100;

const numeroVida =
    document.getElementById("numeroVida");


// ========================================
// ACTUALIZAR ZOMBIES
// ========================================

function actualizarZombies() {

    const ahora = Date.now();

    for (const zombie of zombies) {

        const objeto = zombie.objeto;

        const dx =
            jugador.position.x -
            objeto.position.x;

        const dz =
            jugador.position.z -
            objeto.position.z;

        const distancia =
            Math.sqrt(
                dx * dx +
                dz * dz
            );


        // El zombie mira al jugador

        objeto.lookAt(
            jugador.position.x,
            0,
            jugador.position.z
        );


        // El zombie camina

        if (distancia > 2) {

            objeto.position.x +=
                (dx / distancia) *
                zombie.velocidad;

            objeto.position.z +=
                (dz / distancia) *
                zombie.velocidad;
        }


        // Ataque

        if (
            distancia <= 2 &&
            ahora - zombie.ultimoAtaque > 1000
        ) {

            vida -= 10;

            if (vida < 0) {
                vida = 0;
            }

            numeroVida.textContent = vida;

            zombie.ultimoAtaque = ahora;

            if (vida === 0) {

                alert(
                    "💀 ¡El zombie te atrapó!"
                );

                location.reload();
            }
        }
    }
}


// ========================================
// ANIMACIÓN
// ========================================

function animar() {

    requestAnimationFrame(animar);

    actualizarJugador();

    actualizarZombies();

    renderizador.render(
        escena,
        camara
    );
}

animar();


// ========================================
// REDIMENSIONAR
// ========================================

window.addEventListener(
    "resize",
    () => {

        camara.aspect =
            window.innerWidth /
            window.innerHeight;

        camara.updateProjectionMatrix();

        renderizador.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
